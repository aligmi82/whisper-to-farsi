name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$MGR" --licenses > /dev/null 2>&1 || true
          "$MGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Gradle 8.11.1
        run: |
          set -e
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: bash bootstrap.sh

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/LiveSub-${{ github.run_number }}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: LiveSub-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "LiveSub build ${{ github.run_number }}" \
            --notes "APK دیباگ. کلیدهای API داخل خود برنامه وارد می‌شوند."
